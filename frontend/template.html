<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новости для бизнеса</title>
<link rel="icon" href="data:,">
<style>
:root{
  --brand:#e3262f;
  --ink:#16181d; --ink-2:#4a4f5a; --ink-3:#8a909c;
  --line:#e6e8ec; --bg:#f4f5f7; --card:#fff;
  --fact:#5b6472; --fact-bg:#eef0f3;
  --bank:#e3262f; --bank-bg:#fdecec;
  --ai:#6b4fd8; --ai-bg:#efebfc;
  --rule:#0f7b8a; --rule-bg:#e7f4f5;
  --new:#1a73e8; --new-bg:#e8f0fe;
  --risk:#d23b3b; --opp:#1f9d60; --info:#6b7280;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit}
button{font:inherit;cursor:pointer}
/* шапка */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal}
.logo small{font-weight:400;color:var(--ink-3)}
.switch{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch label{font-size:12px;color:var(--ink-3)}
select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:260px}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 54px)}
nav.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);margin-bottom:2px}
nav.side a.on{background:var(--bg);color:var(--ink);font-weight:600}
.badge-new{white-space:nowrap;display:inline-block;background:var(--new);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:600}
main{padding:24px;max-width:860px;width:100%;min-width:0}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0}
.muted{color:var(--ink-3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
/* сводка компании на главной: только данные банка, без заглушек */
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--ink-2)}.kv b{font-weight:600;text-align:right}
.card h3.card-h{font-size:13px;margin:0 0 6px;color:var(--ink)}
.foot-note{font-size:12px;color:var(--ink-3);margin-top:6px}
.quick{display:flex;gap:8px;margin:0 0 6px}.quick input{flex:1;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.quick-more{font-size:13px;margin:0 0 14px}.quick-more textarea{width:100%;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.ctx{font-size:13px;color:var(--ink-2);margin:6px 0 14px}.ctx b{color:var(--ink);font-weight:600}
nav.side .nav-foot{margin-top:24px;font-size:12px;color:var(--ink-3)}
.modal textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px}
.ev-why{font-size:12px;color:var(--ink-2);margin-top:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--brand);padding:0;font-weight:600}
/* главная */
.widget{margin-top:16px;border-left:4px solid var(--brand)}
.widget-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.w-item{display:flex;gap:10px;align-items:flex-start;text-decoration:none;padding:12px 0;border-top:1px solid var(--line)}
.w-item:first-of-type{border-top:0}
/* «Чувствительность бизнеса»: факторы по данным банка и свежее событие по каждому */
.factors{margin-top:16px}
.factor{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.factor:first-of-type{border-top:0}
.factor .lv{width:10px;height:10px;border-radius:50%;margin-top:5px;background:#cdd1d8}
.factor .lv.high{background:var(--bank)}.factor .lv.medium{background:#e8a33a}
.factor b{font-size:14px}.factor .pd{font-size:12px;color:var(--muted)}
.factor .ps{font-size:13px;margin-top:3px}.factor .ps a{text-decoration:none}
.factor .ps.risk a{color:var(--bank)}.factor .ps.opportunity a{color:#1d8a4b}.factor .ps.calm{color:var(--muted)}
.factor-tag{font-size:11px;color:var(--rule);border:1px solid #bfe0e3;border-radius:999px;padding:1px 8px;white-space:nowrap}
.w-item:hover .w-take{color:var(--brand)}
.w-take{font-weight:600;font-size:15px}
.w-ev{font-size:13px;color:var(--ink-3)}
/* метки */
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.tag.risk{background:#fdeaea;color:var(--risk)}.tag.opportunity{background:#e6f6ee;color:var(--opp)}.tag.info{background:#eef0f3;color:var(--info)}
.imp{font-size:11px;color:var(--ink-3)}
.newmark{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--new);text-transform:uppercase;letter-spacing:.03em}
.newmark::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--new)}
.dot-new{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--new);margin-top:7px}
.dot-read{flex:0 0 8px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink-2)}
.forwho{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.dq{background:#fff7e0;border:1px solid #f1dc9c;color:#6b4d00;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
/* модель недоступна или лимит исчерпан: лента из кратких разборов — честно сказано над лентой */
.ai-off{background:var(--ai-bg);border:1px solid #d9d2f7;color:#3d2a8c;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;font-weight:600}
.an-err{color:var(--risk);font-size:13px;margin:0 0 8px}.an-err:empty{display:none}
/* оговорка под разбором и под виджетом — как в каждом материале банка */
.disclaimer{font-size:11.5px;color:var(--ink-3);margin-top:14px}
.w-sub{font-size:13px;color:var(--ink-2);margin:-2px 0 4px}
.w-quiet{padding:12px 0 2px;font-size:14px;color:var(--ink-2)}.w-quiet a{color:var(--ink);font-weight:600;text-decoration:none}.w-quiet a:hover{color:var(--brand)}
.q-more{margin-left:6px;font-style:normal;font-size:13px}
/* карточка-аккордеон */
.ic{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;transition:box-shadow .2s,border-color .2s;scroll-margin-top:70px}
.ic.is-new{border-color:#c6dafc;box-shadow:0 0 0 3px var(--new-bg)}
.ic.open{box-shadow:0 6px 24px rgba(20,24,32,.08);border-color:#d5d8de}
.ic.fresh{animation:appear .5s ease-out both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ic-head{display:block;width:100%;text-align:left;background:none;border:0;padding:16px 18px;color:inherit}
.ic-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ic-date{margin-left:auto;font-size:12px;color:var(--ink-3)}
.ic-event{font-size:13px;color:var(--ink-2);margin-top:8px;font-weight:600}
.ic-take{font-size:18px;line-height:1.35;font-weight:700;margin:8px 0 10px}
/* короткий слой: вывод, главные числа, позиция банка; событие и источник — мелко внизу */
.nchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.nchip{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 9px;color:var(--ink)}
.kp-bank{border-left:3px solid var(--bank);background:var(--bank-bg);padding:5px 10px;border-radius:0 6px 6px 0;color:var(--ink-2);font-size:13.5px;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kp-bank.kp-note{border-left-color:#c79200;background:#fff7e0;color:#6b4d00}
.kp-bank sup a{color:var(--ink-3);text-decoration:none;font-size:11px}
.ic-ev{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.jobchip{font-size:11px;color:var(--ai);font-weight:600}
.btn .jobchip{color:inherit;font-size:inherit}
/* группы ленты по приоритету */
.grp{margin-top:18px}
.grp-h{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.grp-h .n{color:var(--ink-3);font-weight:400}
/* «К сведению» — одной строкой, раскрывается по нажатию */
.ic.row .ic-head{display:flex;gap:10px;align-items:center;padding:10px 16px}
.ic.row .dot-new,.ic.row .dot-read{margin-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-take{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic.row .ic-date{margin-left:0;flex:0 0 auto}
.ic-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;font-size:12px;color:var(--ink-3)}
.ic-foot .more{flex:0 0 auto}
.more{color:var(--ink);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.more .chev{transition:transform .2s;display:inline-block}
.ic.open .more .chev{transform:rotate(180deg)}
.ic-body{display:none;border-top:1px solid var(--line);padding:4px 18px 18px}
.ic.open .ic-body{display:block}
.sec{margin-top:16px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:0 0 6px}
/* происхождение — цветом: факт без выделения, позиция банка — красным, вывод ИИ — фиолетовым; слово — в подсказке и легенде */
.stmt{padding:6px 10px 6px 12px;margin:6px 0;border-left:3px solid;border-radius:0 6px 6px 0}
.stmt.fact{border-color:#cdd1d8;background:transparent}
.stmt.bank{border-color:var(--bank);background:var(--bank-bg)}
.stmt.ai{border-color:var(--ai);background:var(--ai-bg)}
.stmt.rule{border-color:var(--rule);background:var(--rule-bg)}
.stmt sup a,.kp sup a{color:var(--ink-3);text-decoration:none;font-size:11px}
.str{font-size:11px;color:var(--ink-3);margin-left:6px}
/* расчёт эффекта кодом: формула видна, сумма пересчитывается под пользователя */
.calc{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0;background:#fff}
.calc.risk{border-left-color:var(--risk)}.calc.opportunity{border-left-color:var(--opp)}
.calc-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.calc-v{font-size:16px;font-weight:700}
.calc.risk .calc-v{color:var(--risk)}.calc.opportunity .calc-v{color:var(--opp)}
.calc-f{font-size:12px;color:var(--ink-3);margin-top:2px}
.calc-f code{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--ink-2);background:var(--bg);border-radius:4px;padding:0 4px}
.calc-s{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:13px}
.calc-s input{width:110px;min-width:0;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:8px}
.calc-s output{font-weight:700}
.calc details{margin-top:6px;font-size:13px}.calc summary{cursor:pointer;color:var(--ink-2)}
.calc ul{margin:4px 0 0;padding-left:18px;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two h4{margin:0 0 2px;font-size:13px}
.h-risk{color:var(--risk)}.h-opp{color:var(--opp)}
.quote{border-left:3px solid var(--bank);background:var(--bank-bg);padding:10px 12px;border-radius:0 8px 8px 0;font-style:italic}
.stmt.plain{font-style:normal}
details.sec-d{margin-top:16px}
details.sec-d>summary{cursor:pointer;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
details.sec-d>summary .muted{font-weight:400;text-transform:none;letter-spacing:0}
details.sec-d[open]>summary{margin-bottom:6px}
.stale-note{font-size:12px;color:#8a6200;font-weight:600;margin-top:6px}
.src-line{font-size:12px;color:var(--ink-3);margin-top:6px}
.srcs{margin:0;padding-left:18px}.srcs li{margin:3px 0}
.kind{font-size:10px;font-weight:700;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-right:6px}
.kind.news,.kind.stat{background:var(--fact-bg);color:var(--fact)}.kind.bank{background:var(--bank-bg);color:var(--bank)}
.chip.f{background:#fff;border-color:#d9d2f7;color:var(--ai);display:inline-block;margin:2px 4px 2px 0}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);align-items:center}
.tools .sp{flex:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.legend .l-fact::before{background:#cdd1d8}.legend .l-bank::before{background:var(--bank)}.legend .l-ai::before{background:var(--ai)}.legend .l-rule::before{background:var(--rule)}
/* чат */
.chat{display:none;margin-top:12px;background:var(--bg);border-radius:12px;padding:12px}
.chat.on{display:block}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sugg button{border:1px solid #d9d2f7;background:#fff;color:var(--ai);border-radius:999px;padding:4px 12px}
.msg{margin:8px 0;max-width:88%;overflow-wrap:anywhere}
.chart svg{display:block}
.msg.u{margin-left:auto;background:var(--ink);color:#fff;border-radius:12px 12px 2px 12px;padding:8px 12px;width:fit-content}
.msg.a{background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:8px 12px}
.chat-in{display:flex;gap:8px;margin-top:8px}
.chat-in input{flex:1;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.chart .cap{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:8px}
.chart .note{font-size:11px;color:var(--ink-3)}
.hb{display:grid;gap:6px;margin:6px 0}
.hb-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.hb-l{color:var(--ink-2);overflow-wrap:anywhere}
.hb-t{background:var(--bg);border-radius:4px;height:12px}
.hb-b{display:block;height:100%;border-radius:4px;background:var(--ai)}
.hb-b.unk{opacity:.3}
.hb-v{font-variant-numeric:tabular-nums;color:var(--ink)}
/* панель трассы */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.08);transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility 0s .25s;z-index:40;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;transition:transform .25s,visibility 0s}
.drawer header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .body{padding:16px 18px;overflow:auto;flex:1}
.step{position:relative;padding:0 0 16px 26px;opacity:.25;transition:opacity .3s}
.step.shown{opacity:1}
.step::before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3);background:#fff}
.step.shown .dot{border-color:var(--ai);background:var(--ai)}
.step.k-check.shown .dot{border-color:#c79200;background:#c79200}
.step.k-done.shown .dot{border-color:var(--opp);background:var(--opp)}
.step.k-pending .dot{border-color:var(--ai);background:#fff;animation:pulse 1.2s ease-in-out infinite}
.step.k-pending .st{color:var(--ink-2);font-family:inherit;font-weight:500}
@keyframes pulse{50%{background:var(--ai)}}
@media (prefers-reduced-motion:reduce){.step.k-pending .dot{animation:none;background:var(--ai)}}
.step .st{font-weight:600;font-size:13px;word-break:break-word}
.step .sd{color:var(--ink-2);font-size:13px}
.step .sm{font-size:11px;color:var(--ink-3)}
.totals{border-top:1px solid var(--line);padding:12px 18px;font-size:13px;color:var(--ink-2)}
.overlay{position:fixed;inset:0;background:rgba(15,17,22,.35);display:none;z-index:30}
.overlay.on{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:22px;width:min(380px,92%);z-index:50;display:none}
.modal.on{display:block}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
/* зоны ответственности роли (data/roles.json): сводка на главной и фильтр ленты */
.zones{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.zone{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-decoration:none;color:var(--ink-2);background:#fff}
.zone b{color:var(--ink);font-weight:600}.zone.risk{border-color:#f3c4c4;background:#fff7f7}
.zfs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.zf{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink-2)}
.zf.on{background:var(--ink);color:#fff;border-color:var(--ink)}.zf .n{opacity:.65}
/* фоновые разборы ИИ: индикатор в углу, можно уйти и вернуться */
.dock{position:fixed;right:16px;bottom:16px;z-index:35;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.dock>div{display:flex;flex-direction:column;gap:8px}
.job,.toast{pointer-events:auto}
.job{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(20,24,32,.12);padding:12px 14px;font-size:13px}
.job-h{display:flex;gap:8px;align-items:baseline}
.job-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar{height:6px;background:var(--bg);border-radius:4px;margin:8px 0 6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ai);border-radius:4px;transition:width .9s linear}
.job.done .bar span{background:var(--opp)}.job.failed .bar span{background:var(--risk)}
.job-s{display:flex;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:12px;align-items:center}
.x{border:0;background:none;color:var(--ink-3);font-size:18px;line-height:1;padding:0 2px}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 6px 24px rgba(20,24,32,.18)}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
footer.note{font-size:11px;color:var(--ink-3);margin-top:20px}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px}
  nav.side a{white-space:nowrap}
  nav.side .nav-foot{display:none}
  .top{position:static}
  .ic{scroll-margin-top:8px}
  .grid3,.two{grid-template-columns:1fr}
  main{padding:16px}
  .ic-take{font-size:16px}
}
/* панель управления банка */
body.adm .switch{display:none}
body.adm main{max-width:1120px}

<script id="data" type="application/json">__DATA__</script>
<script>
/* Два режима: статический прототип (build.py вшивает mock_data.json) и рабочий — страницу отдаёт
   бэкенд без данных (null), данные и действия идут через API. */
let DATA = JSON.parse(document.getElementById('data').textContent);
const API = DATA === null;
/* «Прочитано» хранится в браузере: после перезагрузки новые карточки идут выше прочитанных */
const READ_KEY = 'news-read';
function loadRead() { try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); } catch (e) { return new Set(); } }
function saveRead() { try { localStorage.setItem(READ_KEY, JSON.stringify([...state.read].slice(-500))); } catch (e) { /* без хранилища — до перезагрузки */ } }
const state = {company: null, role: null, open: null,
  read: loadRead(), feedback: {}, chats: {}, chatOpen: {}, firstPaint: true, events: {},
  jobs: {}, order: {}, drawer: null, ticker: null, quoteFull: {}, zone: ''};
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail ? (typeof data.detail === 'string' ? data.detail : 'неверный запрос') : 'сервис недоступен');
  return data;
}
const origin = i => ((DATA.origins || {})[state.company] || {})[i.id];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IMPACT = {high: 3, medium: 2, low: 1};
const IMPACT_RU = {high: 'высокое влияние', medium: 'среднее влияние', low: 'низкое влияние'};
const TYPE_RU = {risk: 'риск', opportunity: 'возможность', info: 'к сведению'};
const P_FULL = {fact: 'факт', bank: 'позиция банка', ai: 'вывод ИИ', rule: 'вывод по правилам: собран кодом из новости, данных банка, расчёта и взгляда банка, без ИИ'};
const STR_RU = {high: 'сильное влияние', medium: 'умеренное влияние', low: 'слабое влияние'};
const fmtDate = d => new Date(d).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'});
const fmtDateY = d => new Date(d).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'});

const company = () => DATA.companies.find(c => c.id === state.company);
const role = () => DATA.roles.find(r => r.id === state.role);
// «Сегодня» — дата сервера (воспроизводимая демонстрация задаётся APP_TODAY); давность влияет на порядок и метку «Новое»
const today = () => new Date(((DATA.status && DATA.status.today) || (DATA.generated_at || '').slice(0, 10) || new Date().toISOString().slice(0, 10)) + 'T00:00:00');
const ageDays = i => Math.max(0, (today() - new Date(i.published + 'T00:00:00')) / 864e5);
const NEW_DAYS = 14;
const isNew = i => i.is_new && ageDays(i) <= NEW_DAYS && !state.read.has(state.company + ':' + i.id);
// у разборов, собранных до роли главбуха, его вывода нет — показываем вывод финансового директора
const takeaway = i => (i.takeaway && (i.takeaway[state.role] || i.takeaway.cfo || Object.values(i.takeaway)[0])) || i.why_short;
// Вес темы для роли: правила + чему научили оценки клиентов (для роли и для этой компании) — backend agent/learning.py
function topicWeight(t) {
  const L = DATA.learned || {}, r = (L.roles || {})[state.role] || {}, c = ((L.companies || {})[state.company] || {})[state.role] || {};
  return (role().weights[t] || 0) + (t in c ? c[t] : (r[t] || 0));  // опыт компании заменяет общий опыт роли
}
function scored() {
  return (DATA.insights[state.company] || [])
    // старое событие опускается: после недели — минус 0,35 за день (месячное событие ≈ на уровень влияния ниже свежего)
    .map(i => ({...i, score: IMPACT[i.impact] * 10 + i.topics.reduce((s, t) => s + topicWeight(t), 0) - Math.max(0, ageDays(i) - 7) * 0.35}));
}
// Группы ленты: на что тратить время в первую очередь
const PRIORITY = [['mine', 'Вы прислали'], ['act', 'Требует решения'], ['watch', 'Следить'], ['info', 'К сведению'], ['old', 'Ранее']];
const PR_IDX = {mine: 0, act: 1, watch: 2, info: 3, old: 4};
// новость, которую клиент прислал сам (ссылка или текст): отдельная группа, в «Важное» на главной не попадает
const isMine = i => ((DATA.user_cards || {})[state.company] || []).includes(i.id);
const OLD_DAYS = 30;  // событие старше месяца решения уже не требует — оно уходит в «Ранее»
// Более свежая карточка на ту же тему (та же главная тема, на 3+ дня новее) заменяет старую: две карточки про одну ставку не нужны
function supersededIds(items) {
  const out = new Set();
  for (const a of items) for (const b of items)
    if (a !== b && (a.topics || [])[0] && (a.topics || [])[0] === (b.topics || [])[0] && ageDays(a) - ageDays(b) >= 3) out.add(a.id);
  return out;
}
const priority = (i, old) => isMine(i) ? 'mine' : old.has(i.id) || ageDays(i) > OLD_DAYS ? 'old' : i.type === 'info' ? 'info' : i.impact === 'high' ? 'act' : 'watch';
/* Порядок фиксируется при открытии ленты (компания × роль) и не меняется до перезагрузки: готовый разбор
   обновляет карточку на её месте, новая карточка встаёт первой в своей группе.
   При расчёте: группа → новые выше прочитанных → score. */
function ranked() {
  const key = state.company + '|' + state.role, items = scored(), by = Object.fromEntries(items.map(i => [i.id, i]));
  const old = supersededIds(items), pr = i => priority(i, old);
  let o = state.order[key];
  if (!o) {
    const ids = [...items].sort((a, b) => PR_IDX[pr(a)] - PR_IDX[pr(b)] || isNew(b) - isNew(a) || b.score - a.score).map(i => i.id);
    o = state.order[key] = {ids, group: Object.fromEntries(items.map(i => [i.id, pr(i)]))};
  }
  for (const i of items) {
    if (o.group[i.id]) continue;
    const g = o.group[i.id] = pr(i), at = o.ids.findIndex(id => PR_IDX[o.group[id]] >= PR_IDX[g]);
    o.ids.splice(at < 0 ? o.ids.length : at, 0, i.id);
  }
  return o.ids.filter(id => by[id]).map(id => ({...by[id], group: o.group[id]}));
}
const newCount = () => ranked().filter(isNew).length;
// Зоны ответственности (data/roles.json): карточка попадает в зоны по своим темам, у роли — свои зоны
const ZONES = () => DATA.zones || [];
const zoneName = id => (ZONES().find(z => z.id === id) || {}).name || id;
const zonesOf = i => ZONES().filter(z => z.topics.some(t => (i.topics || []).includes(t))).map(z => z.id);
const myZones = () => role().zones || [];
const plural = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c;
const inZone = (i, z) => !z || (z === 'mine' ? zonesOf(i).some(x => myZones().includes(x)) : zonesOf(i).includes(z));
// «Долг и финансирование: 1 риск, 1 новое» — что происходит в зонах выбранной роли, по свежим событиям
function zoneSummary(items) {
  const row = id => {
    const its = items.filter(i => zonesOf(i).includes(id)), risk = its.filter(i => i.type === 'risk').length;
    const opp = its.filter(i => i.type === 'opportunity').length, nw = its.filter(isNew).length;
    const st = [risk ? `${risk} ${plural(risk, 'риск', 'риска', 'рисков')}` : '', opp ? `${opp} ${plural(opp, 'возможность', 'возможности', 'возможностей')}` : '',
      nw ? `${nw} ${plural(nw, 'новое', 'новых', 'новых')}` : ''].filter(Boolean).join(', ') || 'спокойно';
    return `<a class="zone ${risk ? 'risk' : ''}" href="#feed" data-zone="${id}"><b>${esc(zoneName(id))}</b>: ${st}</a>`;
  };
  return myZones().length ? `<div class="zones" aria-label="Ваши зоны ответственности">${myZones().map(row).join('')}</div>` : '';
}
function zoneFilter(items) {
  const mine = myZones(), rest = ZONES().map(z => z.id).filter(id => !mine.includes(id));
  const btn = (id, name, n) => `<button class="zf ${state.zone === id ? 'on' : ''}" data-zf="${id}" aria-pressed="${state.zone === id}">${esc(name)}${n === null ? '' : ` <span class="n">${n}</span>`}</button>`;
  const count = id => items.filter(i => inZone(i, id)).length;
  return `<div class="zfs" role="group" aria-label="Фильтр по зонам ответственности">${btn('', 'Все', null)}${mine.length ? btn('mine', 'Мои зоны', count('mine')) : ''}`
    + [...mine, ...rest].map(id => count(id) ? btn(id, zoneName(id), count(id)) : '').join('') + '</div>';
}

function companyOptions() {
  const label = c => `${c.display} · ${c.revenue_bn.toLocaleString('ru-RU')} млрд ₽${c.region ? ' · ' + c.region : ''}`;
  const all = [...DATA.companies, ...(DATA.all_companies || []).filter(c => !DATA.companies.some(d => d.id === c.id))];
  const seen = {}; all.forEach(c => { seen[label(c)] = (seen[label(c)] || 0) + 1; });
  const opt = c => `<option value="${c.id}">${esc(label(c))}${seen[label(c)] > 1 ? ' · ' + c.id : ''}</option>`;
  const shown = new Set(DATA.companies.map(c => c.id));
  // остальные компании — по отраслям, крупные отрасли выше
  const groups = {};
  all.filter(c => !shown.has(c.id)).forEach(c => (groups[c.sector || 'Прочие'] = groups[c.sector || 'Прочие'] || []).push(c));
  const rest = Object.entries(groups).sort((a, b) => b[1].length - a[1].length)
    .map(([g, cs]) => `<optgroup label="${esc(g)} (${cs.length})">${cs.map(opt).join('')}</optgroup>`).join('');
  return rest ? `<optgroup label="Подробные разборы">${DATA.companies.map(opt).join('')}</optgroup>${rest}` : DATA.companies.map(opt).join('');
}
async function loadCompany(id) {
  if (!API || DATA.companies.some(c => c.id === id)) return;
  const r = await api('/api/companies/' + id);
  if (DATA.companies.some(c => c.id === id)) return;  // две параллельные загрузки одной компании
  DATA.companies.push(r.company); DATA.insights[id] = r.insights; (DATA.origins = DATA.origins || {})[id] = r.origins;
  (DATA.user_cards = DATA.user_cards || {})[id] = r.user_cards || [];
  (DATA.factor_hits = DATA.factor_hits || {})[id] = r.factor_hits || {};
}
function initSwitchers() {
  $('#sel-company').innerHTML = companyOptions();
  $('#sel-role').innerHTML = DATA.roles.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('');
  $('#sel-company').value = state.company;
  $('#sel-company').onchange = async e => { const id = e.target.value, ticket = state.switchTo = id;
    try { await loadCompany(id); } catch (err) { showModal('Не удалось загрузить компанию', err.message); return; }
    if (state.switchTo !== ticket) return;  // пока грузилась эта компания, выбрали другую
    state.company = id; state.open = null; state.firstPaint = true;
    if (location.hash.startsWith('#feed/')) location.hash = '#feed'; else render(); };
  $('#sel-role').onchange = e => { state.role = e.target.value; state.events = {}; render(); };
}
function renderNav(route) {
  const n = newCount();
  $('#nav').innerHTML = `
    <a href="#home" class="${route === 'home' ? 'on' : ''}">Главная</a>
    <a href="#feed" class="${route === 'feed' ? 'on' : ''}">Новости для бизнеса ${n ? `<span class="badge-new">${n}</span>` : ''}</a>
    ${API ? `<div class="nav-foot">Для сотрудников банка<a href="#admin" class="${route === 'admin' ? 'on' : ''}">Панель управления</a></div>` : ''}`;
}
/* Модель: подключена и лимит дня не исчерпан. Расход и состояние модели — служебные (панель управления);
   клиенту говорим только последствие — разборы сейчас краткие, без выводов ИИ. Выключенный фоновый сбор новостей
   к модели отношения не имеет и плашку не включает. */
const aiReady = () => !!(DATA.status && DATA.status.llm_online && !(DATA.status.spent_today_rub >= DATA.status.budget_rub));
const aiBanner = () => API && DATA.status && !aiReady()
  ? '<div class="ai-off" role="status">ИИ-аналитик недоступен — краткие разборы: факты, позиция банка, расчёт и выводы по правилам, без ИИ</div>' : '';
/* Диалог и панель шагов: Esc закрывает, фокус возвращается на кнопку, которая их открыла
   (если её перерисовали — на такую же кнопку с теми же data-атрибутами) */
let opener = null;
let lastPressed = null;  // Safari не переводит фокус на кнопку при щелчке — запоминаем, что нажали
document.addEventListener('click', e => { lastPressed = e.target.closest('button, a, select, input'); }, true);
function rememberOpener() {
  const a = document.activeElement && document.activeElement !== document.body ? document.activeElement : lastPressed;
  if (!a || a === document.body || a.closest('#modal, #drawer')) return;  // повторный диалог из диалога — прежний источник
  const d = [...a.attributes].find(x => x.name.startsWith('data-'));
  opener = {el: a, sel: a.id ? '#' + CSS.escape(a.id) : d ? `[${d.name}="${CSS.escape(d.value)}"]` : ''};
}
function restoreFocus() {
  const o = opener; opener = null;
  const el = o && (o.el.isConnected ? o.el : o.sel && document.querySelector(o.sel));
  if (el) el.focus();
}
function openDrawer() { rememberOpener(); $('#drawer').classList.add('open'); $('#overlay').classList.add('on'); $('#drawer-close').focus(); }
function showModal(title, text, form = false, submit = 'Отправить менеджеру', placeholder = 'Что обсудить (необязательно)') {
  rememberOpener();
  $('#modal-title').textContent = title; $('#modal-text').textContent = text;
  $('#modal-form').hidden = !form; $('#modal-ok').hidden = form; if (form) $('#modal-form').reset();
  $('#modal-submit').textContent = submit; $('#modal-form').comment.placeholder = placeholder;
  $('#modal').classList.add('on'); $('#overlay').classList.add('on');
  (form ? $('#modal-form').comment : $('#modal-ok')).focus(); }

/* ---------- фрагменты ---------- */
// источник без адреса (например, новость, вставленная пользователем) — подпись без ссылки, а не мёртвый href
const srcLink = (s, inner, title = '') => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener"${title ? ` title="${esc(title)}"` : ''}>${inner}</a>` : `<span title="${esc(title)}">${inner}</span>`;
const ref = (s, i) => (s.src !== undefined && i && i.sources[s.src]) ? ` <sup>${srcLink(i.sources[s.src], `[${s.src + 1}]`, i.sources[s.src].name)}</sup>` : '';
function stmtHtml(s, i) {
  const str = s.strength ? `<span class="str">${STR_RU[s.strength]}</span>` : '';
  return `<div class="stmt ${s.p}" title="${P_FULL[s.p]}">${esc(s.t)}${ref(s, i)}${str}</div>`;
}
const CALC_STR = {high: 'высокая', medium: 'средняя', low: 'низкая'};
const ORIGIN_RU = {seed: 'подготовлены аналитиками', agent: 'ИИ-аналитик', rules: 'краткие разборы'};
// сумма по-русски, как в agent/impact.py: «1,3 млрд ₽», «20 млн ₽»
function rubFmt(x, signed = true) {
  const a = Math.abs(x), sg = x < 0 ? '−' : x > 0 && signed ? '+' : '';
  const f = (v, d) => v.toLocaleString('ru-RU', {maximumFractionDigits: d});
  return sg + (a >= 1e9 ? f(a / 1e9, 1) + ' млрд ₽' : a >= 1e6 ? f(a / 1e6, a >= 1e7 ? 0 : 1) + ' млн ₽' : f(a / 1e3, 0) + ' тыс. ₽');
}
/* Знак суммы — словами, по смыслу расчёта и знаку числа, а не по метке карточки: «−20 млн ₽» у стоимости долга —
   экономия, у выручки — потери. Расходы — как в agent/impact.py COST_TITLES (сценарий «Если …, стоимость долга» — тоже) */
const COST_RX = /стоимость долга|закупк|утильсбор|пошлин|налог|валютные расчёты/i, INCOME_RX = /выручк|доход|маржа/i;
const famOf = t => COST_RX.test(t) ? 'cost' : INCOME_RX.test(t) ? 'income' : '';
const MONEY_WORD = {cost: ['экономия', 'доп. расходы'], income: ['потери', 'доп. доход']};
const moneyWord = (fam, neg) => MONEY_WORD[fam] ? MONEY_WORD[fam][neg ? 0 : 1] : '';

  const upper = !!m[1] || / — верхняя оценка/.test(m[3]), rest = m[3].replace(' — верхняя оценка', '');
  const w = moneyWord(famOf(c.title), m[2] !== '+');
  return w ? `${w} ${upper ? 'до ' : ''}${rest}` : `${upper ? 'до ' : ''}${m[2]}${rest}`;
}
// риск или возможность по экономике расчёта; сценарий («Если …») — без знака
function calcSign(c) {
  const m = SIGNED.exec(c.value), fam = famOf(c.title);
  if (c.sign === 'neutral' || !m || !fam) return c.sign;
  return (m[2] === '+') === (fam === 'cost') ? 'risk' : 'opportunity';
}
// риск не открывается выигрышем, возможность — потерей: подходящие по знаку расчёты идут первыми
const calcFits = (c, i) => i.type === 'info' || [i.type, 'neutral'].includes(calcSign(c));
const calcsOf = i => [...(i.blocks.calc || [])].sort((a, b) => calcFits(b, i) - calcFits(a, i));
function calcHtml(c, i) {
  const sc = c.scale ? `<label class="calc-s">${esc(c.scale.label)} <input type="number" min="0" step="0.1" inputmode="decimal" placeholder="напр. 5" data-per="${c.scale.per_bn}" data-signed="${c.sign !== 'neutral'}" data-fam="${famOf(c.title)}" data-period="${esc(c.scale.period)}"> <output>→ введите сумму, чтобы пересчитать</output></label>` : '';
  return `<div class="calc ${calcSign(c)}"><div class="calc-h"><span>${esc(c.title)}</span><span class="calc-v">${esc(moneyValue(c))}</span></div>
    <div class="calc-f">Формула: <code>${esc(c.formula)}</code>${c.strength ? ' · надёжность оценки: ' + CALC_STR[c.strength] : ''}</div>${sc}
    <details><summary>Данные и допущения</summary>${c.inputs.map(s => stmtHtml(s, i)).join('')}<ul>${c.assumptions.map(a => `<li>${esc(a)}</li>`).join('')}</ul></details></div>`;

const list = (arr, i) => arr && arr.length ? arr.map(s => stmtHtml(s, i)).join('') : '<div class="muted">—</div>';
const cap = t => t ? t[0].toUpperCase() + t.slice(1) : t;
const pctRu = x => x > 0 && x < 0.005 ? 'менее 1%' : Math.round(x * 100) + '%';
// что влияет на отбор новостей: долг, валютные расчёты, главные отрасли покупателей и поставщиков
function forWho(c) {
  const debt = c.products.filter(x => ['кредит', 'лизинг', 'депозиты', 'гарантии'].includes(x));
  const side = s => s && s.top_industries && s.top_industries[0] ? `${s.top_industries[0].who || s.top_industries[0].name.replace(/ \(\d+\)$/, '')} — ${pctRu(s.top_industries[0].share)}` : '';
  const parts = [debt.length ? `<b>${esc(debt.join(', '))}</b>` : '<b>без кредитов в банке</b>',
    c.ved.length ? `внешняя торговля: <b>${esc(c.ved.slice(0, 3).join(', '))}</b>` : 'без внешней торговли',
    side(c.counterparties.customers) ? `покупатели: <b>${esc(side(c.counterparties.customers))}</b>` : '',
    side(c.counterparties.suppliers) ? `поставщики: <b>${esc(side(c.counterparties.suppliers))}</b>` : ''].filter(Boolean);

function srcShort(i) { const m = i.sources.length - 1; return esc(i.sources[0].name) + (m > 0 ? ` +${m}` : ''); }
// признаки компании без кодов отраслей и внутренних терминов (и для карточек, посчитанных до этих правил)
const plainFeat = s => s.replace(/\s*\(\d{2}\)|\s*(?:из\s+)?ОКВЭД\s*\d+(?:\.\d+)*/g, '').replace('входящего потока', 'поступлений').replace('исходящего потока', 'платежей');
const numsOf = s => s.match(/\d+(?:[.,]\d+)?/g) || [];

   платежей, на которые сработал отбор. Число, которое уже есть в главном выводе, не повторяем. */
function numChips(i, take) {
  const calc = calcsOf(i).filter(c => calcFits(c, i)).slice(0, 1).map(c => `${c.title.split(/: | — /)[0]}: ${moneyValue(c)
    .replace(' на каждый ', ' на ').replace(/ с плавающей ставкой| \((?:дороже|дешевле) в рублях\)/g, '')}`);
  const flows = (i.matched || []).filter(m => /\d+%/.test(m)).map(plainFeat);

const evId = i => i.id.slice(0, -(state.company.length + 1));

/* ---------- позиция банка ---------- */
const STALE_DAYS = 365;  // аналитика банка старше 12 месяцев — устаревшая, в выводе не используется
const staleDoc = s => !!s && !!s.date && (today() - new Date(s.date + 'T00:00:00')) / 864e5 > STALE_DAYS;
// пометка команды или агента «свежей оценки нет, последняя — 2021» — это не позиция банка, а честная плашка
const NOTICE_RX = /^«?\s*(?:Последняя доступная|Свежей (?:позиции|оценки))/;
const bankNotice = b => !!b.stale || NOTICE_RX.test(b.quote || '');
const kpNote = (s, i) => NOTICE_RX.test(s.t) || (s.src !== undefined && staleDoc(i.sources[s.src]));
/* Цитата — в «ёлочках» один раз: внешние кавычки самой цитаты снимаются («««…»»» не бывает). Если кавычки,
   открытые в начале, закрываются посередине («…13,5%», при этом…), текст показан как есть, без своих кавычек */
function quoteParts(q) {
  q = String(q || '').trim();
  for (;;) {
    const pair = q[0] === '«' ? '»' : q[0] === '"' ? '"' : '';
    if (!pair) break;
    let d = 0, end = -1;
    for (let k = 0; k < q.length; k++) {
      if (pair === '"') { if (k > 0 && q[k] === '"') { end = k; break; } continue; }
      if (q[k] === '«') d++; else if (q[k] === '»' && --d === 0) { end = k; break; }
    }
    if (end === q.length - 1) q = q.slice(1, -1).trim();
    else if (end < 0) q = q.slice(1).trim();
    else return {text: q, wrap: false};
  }
  if (q.endsWith('»') && (q.match(/«/g) || []).length < (q.match(/»/g) || []).length) q = q.slice(0, -1).trim();
  return {text: q, wrap: true};
}
const QUOTE_MAX = 280;

function quoteHtml(i) {

  const w = t => wrap ? `«${esc(t)}»` : esc(t);
  return `<div class="quote">${full ? w(text) : `${w(cutWords(text, QUOTE_MAX))}<button class="linkbtn q-more" data-qfull>Читать полностью</button>`}</div>`;
}
function bankHtml(i) {
  const b = i.blocks.bank, notice = bankNotice(b), src = `<div class="src-line">${esc(b.doc)}${b.date ? ' · ' + fmtDateY(b.date) : ''}</div>`;
  if (!b.quote) return `<div class="dq">${esc(b.doc)}</div>${b.stale && !/не используется/.test(b.doc) ? '<div class="stale-note">⚠ Материал старше 12 месяцев — в выводе не используется</div>' : ''}`;
  if (notice) return `<div class="dq">${esc(quoteParts(b.quote).text)}</div>${src}${b.stale && !/не используется/.test(b.quote) ? '<div class="stale-note">⚠ Материал старше 12 месяцев — в выводе не используется</div>' : ''}`;

/* Оговорка под разбором и под виджетом — как в каждом материале банка. Центр макроэкономического анализа назван,

/* ---------- экраны ---------- */
// На главной — 3 разных сюжета: два события про одну ставку руководителю не нужны
function topDistinct(items, k) {
  const seen = new Set(), out = [];
  for (const i of items) { const key = (i.topics || [])[0] + '|' + i.type; if (!seen.has(key)) { seen.add(key); out.push(i); } if (out.length === k) return out; }
  return out.concat(items.filter(i => !out.includes(i))).slice(0, k);
}
/* На главную — только то, что стоит времени руководителя: разборы ИИ и аналитиков; краткий разбор правилами —
   если в нём есть расчёт, доля поступлений или платежей или влияние выше низкого. Вывод-ярлык («Касается вас: …»,
   «Событие в отрасли …») ничего не объясняет — такое событие идёт на главную, только если влияние высокое, и главной
   строкой тогда стоит само событие, а ярлык — под ним. Одинаковые выводы и заголовки — один раз */
const LABEL_TAKE = /^(?:Касается вас:|Событие в (?:вашей )?отрасли)/;
const labelTake = i => LABEL_TAKE.test(takeaway(i) || '');
const homeLine = i => labelTake(i) ? i.title : takeaway(i);  // главная строка пункта на главной
function homeWorthy(i) {
  if (labelTake(i)) return i.impact === 'high';
  if (origin(i) !== 'rules') return true;  // agent, seed (и примеры команды в статической сборке)
  return !!(i.blocks.calc || []).length || (i.matched || []).some(m => /\d%/.test(m)) || i.impact !== 'low';
}
function homeItems(items) {
  const seen = new Set(), norm = t => String(t || '').toLowerCase().replace(/\s+/g, ' ').trim();
  return items.filter(homeWorthy).filter(i => {
    const keys = ['t:' + norm(homeLine(i)), 'e:' + norm(i.title)];  // ярлык у разных событий одинаковый — не повтор
    if (keys.some(k => seen.has(k))) return false;
    keys.forEach(k => seen.add(k)); return true;
  });
}
function viewHome() {
  const ok = homeItems(ranked().filter(i => i.group !== 'mine')), fresh = ok.filter(i => i.group !== 'old');
  const c = company(), top = topDistinct(fresh, 3), n = newCount();
  // тихий день: свежего важного нет — так и говорим и даём последнее важное из прошлых событий
  const last = top.length ? null : ok.filter(i => i.group === 'old').sort((a, b) => b.published.localeCompare(a.published))[0];
  const item = i => `<a class="w-item" href="#feed/${i.id}"><span class="${isNew(i) ? 'dot-new' : 'dot-read'}"></span>
        <span><span class="tag ${i.type}">${TYPE_RU[i.type]}</span><div class="w-take" style="margin-top:4px">${esc(homeLine(i))}</div><div class="w-ev">${esc(labelTake(i) ? takeaway(i) : i.title)}</div></span></a>`;
  const body = top.length ? (top.length < 3 ? `<div class="w-sub">Сегодня по-настоящему важно ${top.length} ${top.length === 1 ? 'событие' : 'события'}</div>` : '') + top.map(item).join('')
    : last ? `<div class="w-quiet">Сегодня ничего, что требует решения. <a href="#feed/${last.id}">Последнее важное: ${esc(homeLine(last))} →</a></div>`
    : `<div class="empty">Значимых событий за сутки нет${API ? ' · <a class="linkbtn" href="#feed">Новости по вашему профилю →</a>' : ''}</div>`;
  return `<h1>Добрый день</h1><div class="muted">${esc(c.display)} · ${esc(role().name)}</div>
    <div class="card widget">
      <div class="widget-head"><h2>Важное для вашего бизнеса ${n ? `<span class="badge-new">${n} ${n === 1 ? 'новое' : 'новых'}</span>` : ''}</h2><a class="linkbtn" href="#feed">Все →</a></div>
      ${zoneSummary(fresh)}
      ${body}
      ${disclaimerHtml(top.length ? top : last ? [last] : [])}
    </div>
    ${factorsHtml(c)}
    ${companySummary(c)}`;
}
/* Чувствительность бизнеса (backend agent/sensitivity.py): факторы, через которые внешние события влияют на компанию, по данным
   банка, и свежее событие по каждому. Сначала факторы с риском или возможностью, потом важные для выбранной роли */
const TYPE_STATUS = {risk: 'Риск', opportunity: 'Возможность', info: 'Мониторинг'};
const TOPIC_FACTOR = {'ставка': 'rate', 'долг': 'rate', 'курс': 'fx', 'налоги': 'taxes', 'контрагенты': 'buyers',
                    'ликвидность': 'concentration', 'спрос': 'market', 'отрасль': 'market'};
function factorIds(i) {
  const hits = ((DATA.factor_hits || {})[state.company] || {})[i.id];
  if (hits) return hits;
  const have = new Set((company().factors || []).map(p => p.id));  // новый разбор, пока сервер его не разметил
  return [...new Set((i.topics || []).map(t => TOPIC_FACTOR[t]).filter(id => have.has(id)))];
}
function factorTag(i) {
  const id = factorIds(i)[0], p = id && (company().factors || []).find(x => x.id === id);

/* Поток шагов агента (SSE поверх POST): onStep получает трассу по мере работы, итог — карточка */
async function streamAgent(path, body, onStep) {
  const resp = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (!resp.ok) { const d = await resp.json().catch(() => ({})); throw new Error(typeof d.detail === 'string' ? d.detail : 'сервис недоступен'); }
  const reader = resp.body.getReader(), dec = new TextDecoder();

    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let k;
    while ((k = buf.indexOf('\n\n')) >= 0) {
      const line = buf.slice(0, k).split('\n').find(l => l.startsWith('data: '));
      buf = buf.slice(k + 2);
      if (!line) continue;  // пинг, чтобы соединение не закрылось, пока модель думает
      const ev = JSON.parse(line.slice(6));
      if (ev.type === 'step') onStep(ev);
      else if (ev.type === 'result') return ev;
      else if (ev.type === 'error') throw new Error(ev.detail);
    }
  }
  throw new Error('соединение с сервисом прервалось');
}

  if (has('Самопроверка (модель)')) return [88, 97];
  if (has('Самопроверка (код)')) return [64, 88];
  if (/черновик/i.test(pending || '') || has('calculate_impact()')) return [42, 64];

const ADM = {tab: 'overview', company: '', data: {}};
const admToken = () => { try { return sessionStorage.getItem('adm-token') || ''; } catch (e) { return ADM.token || ''; } };
const admName = () => { try { return sessionStorage.getItem('adm-name') || ''; } catch (e) { return ADM.name || ''; } };
function admSave(token, name) { ADM.token = token; ADM.name = name;
  try { if (token) { sessionStorage.setItem('adm-token', token); sessionStorage.setItem('adm-name', name); } else sessionStorage.removeItem('adm-token'); } catch (e) { /* без хранилища — до перезагрузки */ } }
async function aapi(path, method = 'GET', body) {
  const r = await fetch('/api/admin' + path, {method, headers: {'Content-Type': 'application/json', 'X-Admin-Token': admToken(),
    'X-Admin-Name': encodeURIComponent(admName())}, body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { admSave('', ''); ADM.error = 'Токен не подошёл'; render(); throw new Error('нужен токен сотрудника'); }
  if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'неверный запрос');
  return data;
}

  document.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => { const c = card(b.dataset.hide);
    if (c.hidden) { hide(c, ''); return; }
    showModal('Скрыть разбор', 'Разбор пропадёт из ленты клиента и не будет выдаваться из памяти. Причина попадёт в журнал.', true, 'Скрыть', 'Причина: например, вывод не подтверждается');
    $('#modal-form').onsubmit = e => { e.preventDefault(); hide(c, e.target.comment.value.trim()); }; });
  document.querySelectorAll('[data-rerun]').forEach(b => b.onclick = async () => { const c = card(b.dataset.rerun);
    try { await aapi(`/cards/${c.company_id}/${c.id}/rerun`, 'POST'); toast('Пересчёт запущен — обычно 1–2 минуты. Обновите вкладку позже.', 5000); loadAdmin(); } catch (e) { toast(e.message, 6000); } });
  document.querySelectorAll('[data-look]').forEach(b => b.onclick = async () => { const c = card(b.dataset.look);
    try { const full = await aapi(`/cards/${c.company_id}/${c.id}`);
      $('#drawer-body').innerHTML = `<div class="adm-card"><b>${esc(full.title)}</b><p>${esc((full.takeaway || {}).cfo || full.why_short || '')}</p></div>` + (full.trace || []).map(s => stepHtml(s, true)).join('');
      $('#drawer-totals').textContent = (full.trace || []).length ? totalsText(full.trace) : 'Шагов нет: разбор подготовлен заранее';
      state.drawer = 'admin'; openDrawer(); } catch (e) { toast(e.message, 5000); } });
  const lt = document.querySelector('[data-learning]');
  if (lt) lt.onchange = async () => { try { await aapi('/settings', 'PUT', {learning: lt.checked}); toast(lt.checked ? 'Опыт применяется' : 'Опыт не применяется — копится', 3000); } catch (e) { toast(e.message, 5000); lt.checked = !lt.checked; } };
  const f = $('#adm-settings');
  if (f) f.onsubmit = async e => { e.preventDefault(); const s = ADM.data.settings, body = {};
    ['budget_rub', 'select_min'].forEach(k => body[k] = parseFloat(f[k].value));
    ['rate_limit', 'briefs', 'collect_every_min'].forEach(k => body[k] = parseInt(f[k].value, 10));
    body.learning = f.learning.checked; body.collect_triage = f.collect_triage.checked;
    body.sources_off = [...f.querySelectorAll('[name=src]')].filter(x => !x.checked).map(x => x.value);
    body.routing = Object.fromEntries(s.tasks.map(t => [t, f['route:' + t].value]));
    try { await aapi('/settings', 'PUT', body); $('#adm-msg').textContent = 'Сохранено и применено'; } catch (err) { $('#adm-msg').textContent = err.message; } };
}

/* ---------- чат, график, трасса ---------- */
/* Горизонтальные столбцы для длинных подписей (отрасли) — на HTML, а не SVG: текст не мельчит на телефоне */
function hbarSvg(ch) {
  const max = Math.max(...ch.points.map(p => p[1])) || 1, unit = ch.unit === '%' ? '%' : '';
  const rows = ch.points.map(p => `<div class="hb-row"><span class="hb-l">${esc(p[0])}</span>
    <span class="hb-t"><span class="hb-b${/неизвестн/i.test(p[0]) ? ' unk' : ''}" style="width:${Math.max(p[1] / max * 100, 1).toFixed(1)}%"></span></span>
    <span class="hb-v">${String(p[1]).replace('.', ',')}${unit}</span></div>`).join('');
  return `<div class="chart"><div class="cap">${esc(ch.title)}${ch.unit && ch.unit !== '%' ? ', ' + esc(ch.unit) : ''}</div><div class="hb">${rows}</div>${ch.note ? `<div class="note">${esc(ch.note)}</div>` : ''}</div>`;
}
function chartSvg(ch) {
  if (ch.points.some(p => String(p[0]).length > 9)) return hbarSvg(ch);
  const W = 420, H = 160, pad = 24, max = Math.max(...ch.points.map(p => p[1])) * 1.15, step = (W - pad * 2) / ch.points.length, bw = step * 0.55;
  const bars = ch.points.map((p, k) => { const h = p[1] / max * (H - 46), x = pad + k * step + (step - bw) / 2, y = H - 22 - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="var(--ai)" opacity="${.55 + .45 * (k + 1) / ch.points.length}"/>
    <text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="12" fill="var(--ink)">${String(p[1]).replace('.', ',')}</text>
    <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(p[0])}</text>`; }).join('');
  return `<div class="chart"><div class="cap">${esc(ch.title)}</div><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${bars}</svg>${ch.note ? `<div class="note">${esc(ch.note)}</div>` : ''}</div>`;
}
let traceTimers = [];
const rub = x => x > 0 && x < 0.01 ? '<0,01' : x.toFixed(2).replace('.', ',');
// названия инструментов агента → понятные шаги
const TOOL_RU = {get_event: 'Чтение новости', get_company_profile: 'Профиль компании', get_counterparties: 'Контрагенты компании',
  search_bank_analytics: 'Поиск в аналитике банка', search_news: 'Поиск связанных новостей', calculate_impact: 'Расчёт эффекта в рублях'};
function stepTitle(t) {
  const m = /^(\w+)\((.*)\)$/s.exec(t); if (!m || !TOOL_RU[m[1]]) return t;
  const q = /(?:query=)?"([^"]+)"/.exec(m[2]);
  const qs = q ? (q[1].length > 70 ? q[1].slice(0, 70).replace(/\s+\S*$/, '') + '…' : q[1]) : '';
  return TOOL_RU[m[1]] + (qs && m[1].startsWith('search') ? `: «${qs}»` : '');
}
const stepHtml = (s, shown) => `<div class="step k-${s.kind}${shown ? ' shown' : ''}"><span class="dot"></span><div class="st">${esc(stepTitle(s.title))}</div><div class="sd">${esc(s.detail)}</div>
    <div class="sm">${s.ms ? (s.ms / 1000).toFixed(1).replace('.', ',') + ' с' : ''}</div></div>`;
const totalsText = tr => `Шагов: ${tr.length} · время: ${(tr.reduce((a, s) => a + s.ms, 0) / 1000).toFixed(1).replace('.', ',')} с`;
/* Трасса во время работы агента: готовые шаги + строка «что происходит сейчас» */
function liveTrace(trace, pending) {
  traceTimers.forEach(clearTimeout); traceTimers = [];
  $('#drawer-body').innerHTML = trace.map(s => stepHtml(s, true)).join('')
    + (pending ? `<div class="step shown k-pending"><span class="dot"></span><div class="st">${esc(pending)}</div></div>` : '');
  $('#drawer-totals').textContent = trace.length ? totalsText(trace) : 'План → поиск данных → черновик → проверка. Обычно около минуты.';
}
function openTrace(i) {
  traceTimers.forEach(clearTimeout); traceTimers = [];
  state.drawer = 'card';
  const body = $('#drawer-body');
  body.innerHTML = i.trace.map(s => stepHtml(s, false)).join('');
  $('#drawer-totals').textContent = origin(i) === 'seed' ? 'Разбор подготовлен аналитиками по материалам банка' : totalsText(i.trace);
  openDrawer();
  let t = 150;
  [...body.querySelectorAll('.step')].forEach((el, k) => { traceTimers.push(setTimeout(() => el.classList.add('shown'), t)); t += Math.min(900, 250 + i.trace[k].ms / 6); });
}
// restore — закрыл сам пользователь (Esc, «Закрыть», фон): фокус возвращается туда, откуда открыли
function closeOverlays(restore = false) {
  const was = $('#drawer').classList.contains('open') || $('#modal').classList.contains('on');
  state.drawer = null; $('#drawer').classList.remove('open'); $('#overlay').classList.remove('on'); $('#modal').classList.remove('on');
  if (was && restore) restoreFocus(); else if (was) opener = null;
}

/* ---------- роутинг и события ---------- */
// keep — перерисовка по готовому разбору: открытые панель шагов и диалог не закрываем
function render(scrollToOpen = false, keep = false) {
  const [route, arg] = (location.hash || '#home').slice(1).split('/');
  const r = route === 'insight' ? 'feed' : route === 'quality' ? 'admin' : route;   // старые ссылки #insight/id и #quality
  if (r === 'feed' && arg && state.open !== arg) { state.open = arg; markRead(arg); scrollToOpen = true; }
  if (!keep) closeOverlays();
  renderNav(r);
  if (r === 'analyze') { location.replace('#feed'); return; }  // старые ссылки на отдельную страницу
  const views = {feed: viewFeed, admin: viewAdmin};
  document.body.classList.toggle('adm', r === 'admin' && API);
  $('#app').innerHTML = (API && views[r] || (r === 'feed' ? viewFeed : viewHome))();
  state.firstPaint = false;
  bind();
  if (r === 'feed') { loadEvents(); bindEvents(); }
  if (r === 'admin' && API) bindAdmin();
  if (r === 'feed' && API && $('#quick-an')) {
    /* Ссылку не прочитали — она остаётся в поле, ошибка видна под ним, а поле для текста открыто: можно вставить
       текст новости. Удачный разбор перерисовывает ленту — форма снова пустая */
    $('#quick-an').onsubmit = async e => { e.preventDefault(); const f = e.target, url = f.url.value.trim(), btn = f.querySelector('button');
      if (!url || btn.disabled) return;
      $('#an-err').textContent = ''; btn.disabled = true; btn.textContent = 'Читаем ссылку…';
      await analyzeNow(state.company + ':url:' + url, hostOf(url), '/api/brief', '/api/analyze', {company_id: state.company, url}, err => {
        if (!f.isConnected) { toast(err.message, 6000); return; }
        $('#an-err').textContent = `${cap(err.message.replace(/[.\s]+$/, ''))}. Можно вставить текст новости ниже.`;
        document.querySelector('.quick-more').open = true; });
      if (btn.isConnected) { btn.disabled = false; btn.textContent = 'Оценить'; } };
    $('#quick-text-go').onclick = async () => { const text = $('#quick-text').value.trim();
      if (text.length < 40) { $('#an-msg').textContent = 'Вставьте текст новости — хотя бы пару предложений'; return; }
      const title = text.split(/[.!?\n]/)[0].slice(0, 200);
      $('#an-msg').textContent = '';
      const ok = await analyzeNow(state.company + ':text:' + title, title, '/api/brief', '/api/analyze', {company_id: state.company, title, text},
        err => { if ($('#an-msg')) $('#an-msg').textContent = err.message; else toast(err.message, 6000); });
      if (ok && $('#quick-text')) $('#quick-text').value = ''; };
  }
  if (scrollToOpen && state.open) { const el = document.getElementById('card-' + state.open); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  else if (!arg) window.scrollTo(0, 0);
}
function markRead(id) { state.read.add(state.company + ':' + id); saveRead(); }
function toggle(id) {
  if (state.open === id) { state.open = null; history.replaceState(null, '', '#feed'); render(); return; }
  state.open = id; markRead(id);
  history.replaceState(null, '', '#feed/' + id);
  render(true);
}
function bind() {
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggle(b.dataset.toggle));
  document.querySelectorAll('[data-zone]').forEach(a => a.onclick = () => { state.zone = a.dataset.zone; });
  document.querySelectorAll('[data-zf]').forEach(b => b.onclick = () => { state.zone = b.dataset.zf; render(); });
  if (!state.open) return;
  const i = ranked().find(x => x.id === state.open); if (!i) return;
  const card = document.getElementById('card-' + i.id); if (!card) return;
  card.querySelector('[data-trace]').onclick = () => openTrace(i);
  const qf = card.querySelector('[data-qfull]');  // длинная цитата банка: полный текст — по нажатию, на месте
  if (qf) qf.onclick = () => { state.quoteFull[i.id] = true; qf.closest('.quote').outerHTML = quoteHtml(i); };
  card.querySelector('[data-share]').onclick = () => shareCard(i);
  const up = card.querySelector('[data-upgrade]');  // краткий разбор → полный разбор агентом по тому же событию
  if (up) up.onclick = () => startJob(state.company + ':' + evId(i), i.title, `/api/companies/${state.company}/events/${evId(i)}/analyze`, {});
  card.querySelector('[data-chat]').onclick = () => { state.chatOpen[i.id] = !state.chatOpen[i.id]; render(); };
  card.querySelectorAll('[data-fb]').forEach(b => b.onclick = () => { state.feedback[i.id] = b.dataset.fb; render();
    if (API) api(`/api/cards/${i.id}/feedback`, {company_id: state.company, role: state.role, vote: b.dataset.fb}).catch(() => {}); });
  card.querySelectorAll('[data-per]').forEach(inp => inp.oninput = () => {
    const v = parseFloat(inp.value.replace(',', '.')), out = inp.parentElement.querySelector('output'), x = v * +inp.dataset.per;
    const w = x ? moneyWord(inp.dataset.fam, x < 0) : '';  // как в заголовке расчёта: «экономия 100 млн ₽ в год»
    out.textContent = v > 0 ? '→ ' + (w ? w + ' ' + rubFmt(Math.abs(x), false) : rubFmt(x, inp.dataset.signed === 'true')) + ' ' + inp.dataset.period : '→ введите сумму, чтобы пересчитать';
  });
  card.querySelectorAll('[data-cta]').forEach(b => b.onclick = () => {
    if (!API) { showModal(b.dataset.label, 'Обратитесь к вашему персональному менеджеру — разбор события он увидит в карточке клиента.'); return; }
    showModal(b.dataset.label, 'Менеджер получит этот разбор и свяжется с вами в течение рабочего дня.', true);
    $('#modal-form').onsubmit = async e => { e.preventDefault();
      try { await api(`/api/cards/${i.id}/request`, {company_id: state.company, role: state.role, kind: b.dataset.cta, label: b.dataset.label, comment: e.target.comment.value});
        showModal('Запрос передан менеджеру', 'Менеджер свяжется с вами в течение рабочего дня. К запросу приложен разбор события.');
      } catch (err) { showModal('Запрос не отправлен', err.message); } };
  });
  const log = card.querySelector('.chat-log');
  const push = (q, html) => { (state.chats[i.id] = state.chats[i.id] || []).push(`<div class="msg u">${esc(q)}</div>`, `<div class="msg a">${html}</div>`); log.innerHTML = state.chats[i.id].join(''); };
  card.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const c = i.chat[+b.dataset.q]; push(c.q, c.a.map(s => stmtHtml(s)).join('') + (c.chart ? chartSvg(c.chart) : '')); });
  card.querySelectorAll('[data-gq]').forEach(b => b.onclick = () => { const f = card.querySelector('.chat-in'); f.querySelector('input').value = b.dataset.gq; f.requestSubmit(); });
  card.querySelector('.chat-in').onsubmit = async e => { e.preventDefault(); const inp = e.target.querySelector('input'), q = inp.value.trim(); if (!q) return;
    inp.value = '';
    if (!API) { push(q, '<div class="muted">Выберите один из подсказанных вопросов выше.</div>'); return; }
    log.insertAdjacentHTML('beforeend', `<div class="msg u">${esc(q)}</div><div class="msg a muted" id="chat-wait">Ищем ответ в аналитике банка…</div>`);
    try { const r = await api(`/api/cards/${i.id}/chat`, {company_id: state.company, q});
      (state.chats[i.id] = state.chats[i.id] || []).push(`<div class="msg u">${esc(q)}</div>`, `<div class="msg a">${r.a.map(s => stmtHtml(s, i)).join('')}${r.chart ? chartSvg(r.chart) : ''}</div>`);
    } catch (err) { (state.chats[i.id] = state.chats[i.id] || []).push(`<div class="msg u">${esc(q)}</div>`, `<div class="msg a muted">${esc(err.message)}</div>`); }
    log.innerHTML = state.chats[i.id].join(''); };
}
const closeByUser = () => closeOverlays(true);
$('#overlay').onclick = closeByUser; $('#drawer-close').onclick = closeByUser; $('#modal-ok').onclick = closeByUser; $('#modal [data-close]').onclick = closeByUser;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ($('#drawer').classList.contains('open') || $('#modal').classList.contains('on'))) { e.preventDefault(); closeByUser(); }
});
window.addEventListener('hashchange', () => render());
(async function boot() {
  if (API) {
    try { DATA = await api('/api/bootstrap'); }
    catch (e) { $('#app').innerHTML = `<div class="card empty">Сервис недоступен: ${esc(e.message)}</div>`; return; }
  }
  state.company = DATA.companies[0].id; state.role = DATA.roles[0].id;
  const q = new URLSearchParams(location.search), card = (location.hash.match(/^#feed\/(.+)$/) || [])[1];
  const owner = q.get('c') || (card && (Object.keys(DATA.insights).find(c => DATA.insights[c].some(i => i.id === card))
    || (card.match(/-(U_\d+)$/) || [])[1]));
  if (owner && owner !== state.company && (DATA.all_companies || []).some(c => c.id === owner)) {
    try { await loadCompany(owner); state.company = owner; } catch (e) { /* остаёмся на первой компании */ }
  }
  if (DATA.roles.some(r => r.id === q.get('r'))) state.role = q.get('r');
  initSwitchers(); $('#sel-role').value = state.role;
  render();
})();
</script>
</body>

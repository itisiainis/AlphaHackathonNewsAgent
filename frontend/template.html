<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новости для бизнеса — прототип</title>
<link rel="icon" href="data:,">
<style>
:root{
  --brand:#e3262f;
  --ink:#16181d; --ink-2:#4a4f5a; --ink-3:#8a909c;
  --line:#e6e8ec; --bg:#f4f5f7; --card:#fff;
  --fact:#5b6472; --fact-bg:#eef0f3;
  --bank:#e3262f; --bank-bg:#fdecec;
  --ai:#6b4fd8; --ai-bg:#efebfc;
  --new:#1a73e8; --new-bg:#e8f0fe;
  --risk:#d23b3b; --opp:#1f9d60; --info:#6b7280;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit}
button{font:inherit;cursor:pointer}
/* шапка */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal}
.logo small{font-weight:400;color:var(--ink-3)}
.switch{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch label{font-size:12px;color:var(--ink-3)}
select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:260px}
.demo-tag{font-size:11px;background:#fff7e0;color:#8a6200;border:1px solid #f1dc9c;border-radius:6px;padding:2px 8px}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 54px)}
nav.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);margin-bottom:2px}
nav.side a.on{background:var(--bg);color:var(--ink);font-weight:600}
nav.side a.dis{color:var(--ink-3);pointer-events:none}
.badge-new{white-space:nowrap;display:inline-block;background:var(--new);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:600}
main{padding:24px;max-width:860px;width:100%}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0}
.muted{color:var(--ink-3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ph{height:10px;border-radius:5px;background:#eceef1;margin:8px 0}
.ph.w60{width:60%}.ph.w40{width:40%}.ph.w80{width:80%}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--brand);padding:0;font-weight:600}
/* главная */
.widget{margin-top:16px;border-left:4px solid var(--brand)}
.widget-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.w-item{display:flex;gap:10px;align-items:flex-start;text-decoration:none;padding:12px 0;border-top:1px solid var(--line)}
.w-item:first-of-type{border-top:0}
.w-item:hover .w-take{color:var(--brand)}
.w-take{font-weight:600;font-size:15px}
.w-ev{font-size:13px;color:var(--ink-3)}
/* метки */
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.tag.risk{background:#fdeaea;color:var(--risk)}.tag.opportunity{background:#e6f6ee;color:var(--opp)}.tag.info{background:#eef0f3;color:var(--info)}
.imp{font-size:11px;color:var(--ink-3)}
.newmark{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--new);text-transform:uppercase;letter-spacing:.03em}
.newmark::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--new)}
.dot-new{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--new);margin-top:7px}
.dot-read{flex:0 0 8px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink-2)}
.forwho{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dq{background:#fff7e0;border:1px solid #f1dc9c;color:#6b4d00;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
/* карточка-аккордеон */
.ic{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;transition:box-shadow .2s,border-color .2s;scroll-margin-top:70px}
.ic.is-new{border-color:#c6dafc;box-shadow:0 0 0 3px var(--new-bg)}
.ic.open{box-shadow:0 6px 24px rgba(20,24,32,.08);border-color:#d5d8de}
.ic.fresh{animation:appear .5s ease-out both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ic-head{display:block;width:100%;text-align:left;background:none;border:0;padding:16px 18px;color:inherit}
.ic-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ic-date{margin-left:auto;font-size:12px;color:var(--ink-3)}
.ic-event{font-size:13px;color:var(--ink-2);margin-top:8px;font-weight:600}
.ic-take{font-size:18px;line-height:1.35;font-weight:700;margin:4px 0 10px}
.kp{list-style:none;margin:0;padding:0}
.kp li{display:flex;gap:8px;align-items:baseline;margin:5px 0;color:var(--ink-2)}
.pdot{flex:0 0 auto;font-size:10px;font-weight:700;text-transform:uppercase;border-radius:4px;padding:1px 5px;letter-spacing:.03em}
.pdot.fact{background:var(--fact-bg);color:var(--fact)}.pdot.bank{background:var(--bank-bg);color:var(--bank)}.pdot.ai{background:var(--ai-bg);color:var(--ai)}
.ic-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-3)}
.more{color:var(--ink);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.more .chev{transition:transform .2s;display:inline-block}
.ic.open .more .chev{transform:rotate(180deg)}
.ic-body{display:none;border-top:1px solid var(--line);padding:4px 18px 18px}
.ic.open .ic-body{display:block}
.sec{margin-top:16px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:0 0 6px}
.stmt{padding:6px 10px 6px 12px;margin:6px 0;border-left:3px solid;border-radius:0 6px 6px 0}
.stmt.fact{border-color:var(--fact);background:var(--fact-bg)}
.stmt.bank{border-color:var(--bank);background:var(--bank-bg)}
.stmt.ai{border-color:var(--ai);background:var(--ai-bg)}
.stmt .p{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.stmt.fact .p{color:var(--fact)}.stmt.bank .p{color:var(--bank)}.stmt.ai .p{color:var(--ai)}
.stmt sup a,.kp sup a{color:var(--ink-3);text-decoration:none;font-size:11px}
.str{font-size:11px;color:var(--ink-3);margin-left:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two h4{margin:0 0 2px;font-size:13px}
.h-risk{color:var(--risk)}.h-opp{color:var(--opp)}
.quote{border-left:3px solid var(--bank);background:var(--bank-bg);padding:10px 12px;border-radius:0 8px 8px 0;font-style:italic}
.quote.stale{border-color:#c79200;background:#fff7e0}
.stale-note{font-size:12px;color:#8a6200;font-weight:600;margin-top:6px}
.src-line{font-size:12px;color:var(--ink-3);margin-top:6px}
.srcs{margin:0;padding-left:18px}.srcs li{margin:3px 0}
.kind{font-size:10px;font-weight:700;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-right:6px}
.kind.news,.kind.stat{background:var(--fact-bg);color:var(--fact)}.kind.bank{background:var(--bank-bg);color:var(--bank)}
.chip.f{background:#fff;border-color:#d9d2f7;color:var(--ai);display:inline-block;margin:2px 4px 2px 0}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);align-items:center}
.tools .sp{flex:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.legend .l-fact::before{background:var(--fact)}.legend .l-bank::before{background:var(--bank)}.legend .l-ai::before{background:var(--ai)}
/* чат */
.chat{display:none;margin-top:12px;background:var(--bg);border-radius:12px;padding:12px}
.chat.on{display:block}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sugg button{border:1px solid #d9d2f7;background:#fff;color:var(--ai);border-radius:999px;padding:4px 12px}
.msg{margin:8px 0;max-width:88%}
.msg.u{margin-left:auto;background:var(--ink);color:#fff;border-radius:12px 12px 2px 12px;padding:8px 12px;width:fit-content}
.msg.a{background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:8px 12px}
.chat-in{display:flex;gap:8px;margin-top:8px}
.chat-in input{flex:1;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.chart .cap{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:8px}
.chart .note{font-size:11px;color:var(--ink-3)}
/* панель трассы */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.08);transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:40;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible}
.drawer header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .body{padding:16px 18px;overflow:auto;flex:1}
.step{position:relative;padding:0 0 16px 26px;opacity:.25;transition:opacity .3s}
.step.shown{opacity:1}
.step::before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3);background:#fff}
.step.shown .dot{border-color:var(--ai);background:var(--ai)}
.step.k-check.shown .dot{border-color:#c79200;background:#c79200}
.step.k-done.shown .dot{border-color:var(--opp);background:var(--opp)}
.step .st{font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-word}
.step .sd{color:var(--ink-2);font-size:13px}
.step .sm{font-size:11px;color:var(--ink-3)}
.totals{border-top:1px solid var(--line);padding:12px 18px;font-size:13px;color:var(--ink-2)}
.overlay{position:fixed;inset:0;background:rgba(15,17,22,.35);display:none;z-index:30}
.overlay.on{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:22px;width:min(380px,92%);z-index:50;display:none}
.modal.on{display:block}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
footer.note{font-size:11px;color:var(--ink-3);margin-top:20px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px}
  nav.side a{white-space:nowrap}
  .grid3,.two{grid-template-columns:1fr}
  main{padding:16px}
  .ic-take{font-size:16px}
}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><i>Б</i>Бизнес-банк <small>· прототип</small></div>
  <span class="demo-tag">демо-режим</span>
  <div class="switch">
    <label for="sel-company">Компания</label><select id="sel-company"></select>
    <label for="sel-role">Роль</label><select id="sel-role"></select>
  </div>
</div>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="app"></main>
</div>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Шаги агента">
  <header><b>Как ИИ пришёл к выводу</b><button class="btn" id="drawer-close">Закрыть</button></header>
  <div class="body" id="drawer-body"></div>
  <div class="totals" id="drawer-totals"></div>
</aside>
<div class="modal" id="modal">
  <h2 id="modal-title">Заявка отправлена</h2>
  <p class="muted" id="modal-text"></p>
  <button class="btn pri" id="modal-ok">Понятно</button>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
/* Два режима: статический прототип (build.py вшивает mock_data.json) и рабочий — страницу отдаёт
   бэкенд без данных (null), данные и действия идут через API. */
let DATA = JSON.parse(document.getElementById('data').textContent);
const API = DATA === null;
const state = {company: null, role: null, filter: 'all', open: null,
  read: new Set(), feedback: {}, chats: {}, chatOpen: {}, firstPaint: true, events: {}, busy: false};
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail ? (typeof data.detail === 'string' ? data.detail : 'неверный запрос') : 'сервис недоступен');
  return data;
}
const origin = i => ((DATA.origins || {})[state.company] || {})[i.id];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IMPACT = {high: 3, medium: 2, low: 1};
const IMPACT_RU = {high: 'высокое влияние', medium: 'среднее влияние', low: 'низкое влияние'};
const TYPE_RU = {risk: 'риск', opportunity: 'возможность', info: 'к сведению'};
const P_RU = {fact: 'факт', bank: 'банк', ai: 'ИИ'};
const P_FULL = {fact: 'факт', bank: 'позиция банка', ai: 'вывод ИИ'};
const STR_RU = {high: 'сильно', medium: 'умеренно', low: 'слабо'};
const fmtDate = d => new Date(d).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'});
const fmtDateY = d => new Date(d).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'});

const company = () => DATA.companies.find(c => c.id === state.company);
const role = () => DATA.roles.find(r => r.id === state.role);
const isNew = i => i.is_new && !state.read.has(state.company + ':' + i.id);
const takeaway = i => (i.takeaway && (i.takeaway[state.role] || Object.values(i.takeaway)[0])) || i.why_short;
function ranked() {
  const w = role().weights;
  return (DATA.insights[state.company] || [])
    .map(i => ({...i, score: IMPACT[i.impact] * 10 + i.topics.reduce((s, t) => s + (w[t] || 0), 0)}))
    .sort((a, b) => b.score - a.score);
}
const newCount = () => ranked().filter(isNew).length;

function companyOptions() {
  const demo = DATA.companies.map(c => `<option value="${c.id}">${esc(c.display)} · ${c.id}</option>`).join('');
  const shown = new Set(DATA.companies.map(c => c.id));
  const rest = (DATA.all_companies || []).filter(c => !shown.has(c.id))
    .map(c => `<option value="${c.id}">${esc(c.display)} · ${c.revenue_bn.toLocaleString('ru-RU')} млрд ₽ · ${c.id}</option>`).join('');
  return rest ? `<optgroup label="С карточками">${demo}</optgroup><optgroup label="Все компании выборки">${rest}</optgroup>` : demo;
}
async function loadCompany(id) {
  if (!API || DATA.companies.some(c => c.id === id)) return;
  const r = await api('/api/companies/' + id);
  DATA.companies.push(r.company); DATA.insights[id] = r.insights; (DATA.origins = DATA.origins || {})[id] = r.origins;
}
function initSwitchers() {
  $('#sel-company').innerHTML = companyOptions();
  $('#sel-role').innerHTML = DATA.roles.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('');
  $('#sel-company').value = state.company;
  $('#sel-company').onchange = async e => { const id = e.target.value;
    try { await loadCompany(id); } catch (err) { showModal('Не удалось загрузить компанию', err.message); return; }
    state.company = id; state.open = null; state.firstPaint = true;
    if (location.hash.startsWith('#feed/')) location.hash = '#feed'; else render(); };
  $('#sel-role').onchange = e => { state.role = e.target.value; render(); };
}
function renderNav(route) {
  const n = newCount();
  $('#nav').innerHTML = `
    <a href="#home" class="${route === 'home' ? 'on' : ''}">Главная</a>
    <a class="dis">Счета</a><a class="dis">Платежи</a><a class="dis">Документы</a>
    <a href="#feed" class="${route === 'feed' ? 'on' : ''}">Новости для бизнеса ${n ? `<span class="badge-new">${n}</span>` : ''}</a>
    ${API ? `<a href="#analyze" class="${route === 'analyze' ? 'on' : ''}">Разобрать новость</a>
    <a href="#quality" class="${route === 'quality' ? 'on' : ''}">Качество</a>` : ''}`;
}
function renderStatus() {
  if (!API || !DATA.status) return;
  const s = DATA.status;
  $('.demo-tag').textContent = s.llm_online ? `модель подключена · расход сегодня ${s.spent_today_rub.toLocaleString('ru-RU')} из ${s.budget_rub} ₽`
    : 'без ключа модели: доступны отбор и готовые карточки';
}
function showModal(title, text) { $('#modal-title').textContent = title; $('#modal-text').textContent = text;
  $('#modal').classList.add('on'); $('#overlay').classList.add('on'); }

/* ---------- фрагменты ---------- */
// источник без адреса (например, новость, вставленная пользователем) — подпись без ссылки, а не мёртвый href
const srcLink = (s, inner, title = '') => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener"${title ? ` title="${esc(title)}"` : ''}>${inner}</a>` : `<span title="${esc(title)}">${inner}</span>`;
const ref = (s, i) => (s.src !== undefined && i && i.sources[s.src]) ? ` <sup>${srcLink(i.sources[s.src], `[${s.src + 1}]`, i.sources[s.src].name)}</sup>` : '';
function stmtHtml(s, i) {
  const str = s.strength ? `<span class="str">${STR_RU[s.strength]}</span>` : '';
  return `<div class="stmt ${s.p}"><span class="p">${P_FULL[s.p]}</span>${esc(s.t)}${ref(s, i)}${str}</div>`;
}
const list = (arr, i) => arr && arr.length ? arr.map(s => stmtHtml(s, i)).join('') : '<div class="muted">—</div>';
function forWho(c) {
  const chips = [c.okved + ' ' + c.industry, c.revenue_bn.toLocaleString('ru-RU') + ' млрд ₽', c.region, ...c.products,
    ...(c.ved.length ? ['ВЭД: ' + c.ved.join(', ')] : []), ...(c.group_size > 1 ? ['группа: ' + c.group_size + ' юрлиц'] : [])];
  return `<div class="forwho"><span class="muted">Подобрано для:</span>${chips.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>`;
}
function srcShort(i) { const m = i.sources.length - 1; return esc(i.sources[0].name) + (m > 0 ? ` +${m}` : ''); }

/* ---------- карточка-аккордеон ---------- */
function cardHtml(i) {
  const open = state.open === i.id, nw = isNew(i);
  const kp = (i.key_points || []).map(s => `<li><span class="pdot ${s.p}">${P_RU[s.p]}</span><span>${esc(s.t)}${ref(s, i)}</span></li>`).join('');
  return `<article class="ic ${open ? 'open' : ''} ${nw ? 'is-new' : ''} ${state.firstPaint ? 'fresh' : ''}" id="card-${i.id}">
    <button class="ic-head" data-toggle="${i.id}" aria-expanded="${open}">
      <div class="ic-meta">${nw ? '<span class="newmark">Новое</span>' : ''}<span class="tag ${i.type}">${TYPE_RU[i.type]}</span><span class="imp">${IMPACT_RU[i.impact]}</span>${origin(i) === 'seed' ? '<span class="chip" title="Карточка подготовлена командой по материалам кейса, не агентом">пример</span>' : ''}<span class="ic-date">${fmtDate(i.published)}</span></div>
      <div class="ic-event">${esc(i.title)}</div>
      <div class="ic-take">${esc(takeaway(i))}</div>
      <ul class="kp">${kp}</ul>
      <div class="ic-foot"><span>${srcShort(i)}</span><span class="more">${open ? 'Свернуть' : 'Подробнее'} <span class="chev">▾</span></span></div>
    </button>
    ${open ? bodyHtml(i) : ''}
  </article>`;
}
function bodyHtml(i) {
  const b = i.blocks, fb = state.feedback[i.id];
  const ctas = b.actions.filter(a => a.cta).map(a => `<button class="btn pri" data-cta="${a.cta.kind}" data-label="${esc(a.cta.label)}">${esc(a.cta.label)}</button>`).join('');
  const chatLog = (state.chats[i.id] || []).join('');
  return `<div class="ic-body">
    <div class="legend"><span class="l-fact">факт из источника</span><span class="l-bank">позиция банка</span><span class="l-ai">вывод ИИ</span></div>
    <div class="sec"><h3>Что произошло</h3>${list(b.what, i)}</div>
    <div class="sec"><h3>Почему это важно вам</h3>${list(b.why, i)}</div>
    <div class="sec"><h3>Последствия</h3><div class="two"><div><h4 class="h-risk">Риски</h4>${list(b.risks, i)}</div><div><h4 class="h-opp">Возможности</h4>${list(b.opportunities, i)}</div></div></div>
    <div class="sec"><h3>Что можно сделать</h3>${list(b.actions, i)}${ctas ? `<div class="actions-row">${ctas}</div>` : ''}</div>
    <div class="sec"><h3>Как оценивает банк</h3>${b.bank.quote ? `<div class="quote ${b.bank.stale ? 'stale' : ''}">«${esc(b.bank.quote)}»</div>
      <div class="src-line">${esc(b.bank.doc)} · ${fmtDateY(b.bank.date)}</div>` : `<div class="dq">${esc(b.bank.doc)}</div>`}
      ${b.bank.stale ? '<div class="stale-note">⚠ Материал старше 12 месяцев — в выводе не используется</div>' : ''}</div>
    <div class="sec"><h3>На чём основан вывод</h3><div class="two">
      <div><h4>Источники</h4><ol class="srcs">${i.sources.map(s => `<li><span class="kind ${s.kind}">${s.kind === 'bank' ? 'банк' : s.kind === 'stat' ? 'статистика' : 'новость'}</span>${srcLink(s, esc(s.name))} <span class="muted">· ${fmtDateY(s.date)}</span></li>`).join('')}</ol></div>
      <div><h4>Признаки вашей компании</h4>${b.basis.features.map(f => `<span class="chip f">${esc(f)}</span>`).join('')}
        ${b.basis.coverage ? `<div class="dq" style="margin-top:8px">${esc(b.basis.coverage)}</div>` : ''}</div></div></div>
    <div class="tools">
      <button class="btn" data-trace="${i.id}">Как ИИ пришёл к выводу</button>
      <button class="btn ${state.chatOpen[i.id] ? 'sel' : ''}" data-chat="${i.id}">Задать вопрос</button>
      <span class="sp"></span>
      <span class="muted">Полезно?</span>
      <button class="btn ${fb === 'up' ? 'sel' : ''}" data-fb="up">Да</button>
      <button class="btn ${fb === 'down' ? 'sel' : ''}" data-fb="down">Не про нас</button>
    </div>
    <div class="chat ${state.chatOpen[i.id] ? 'on' : ''}">
      ${i.chat.length ? `<div class="sugg">${i.chat.map((c, k) => `<button data-q="${k}">${esc(c.q)}</button>`).join('')}</div>` : ''}
      <div class="chat-log">${chatLog}</div>
      <form class="chat-in"><input placeholder="Вопрос по этому событию" autocomplete="off"><button class="btn pri">Спросить</button></form>
    </div>
  </div>`;
}

/* ---------- экраны ---------- */
function viewHome() {
  const c = company(), top = ranked().slice(0, 3), n = newCount();
  return `<h1>Добрый день</h1><div class="muted">${esc(c.display)} · ${c.id} · ${esc(role().name)}</div>
    <div class="grid3" style="margin-top:16px">${['Расчётный счёт', 'Валютный счёт', 'Кредиты и лизинг'].map(t => `<div class="card"><div class="muted">${t}</div><div class="ph w60"></div><div class="ph w40"></div></div>`).join('')}</div>
    <div class="card widget">
      <div class="widget-head"><h2>Важное для вашего бизнеса ${n ? `<span class="badge-new">${n} ${n === 1 ? 'новое' : 'новых'}</span>` : ''}</h2><a class="linkbtn" href="#feed">Все →</a></div>
      ${top.length ? top.map(i => `<a class="w-item" href="#feed/${i.id}"><span class="${isNew(i) ? 'dot-new' : 'dot-read'}"></span>
        <span><span class="tag ${i.type}">${TYPE_RU[i.type]}</span><div class="w-take" style="margin-top:4px">${esc(takeaway(i))}</div><div class="w-ev">${esc(i.title)}</div></span></a>`).join('')
        : `<div class="empty">${API ? 'Разобранных событий пока нет. <a class="linkbtn" href="#feed">Посмотреть отобранные новости →</a>' : 'Значимых событий за сутки нет'}</div>`}
    </div>
    <div class="grid3" style="margin-top:16px">${['Последние платежи', 'Документы на подпись', 'Предложения'].map(t => `<div class="card"><div class="muted">${t}</div><div class="ph w80"></div><div class="ph w60"></div></div>`).join('')}</div>`;
}
function viewFeed() {
  const c = company();
  let items = ranked();
  if (state.filter !== 'all') items = items.filter(i => i.type === state.filter);
  const f = (id, label) => `<button data-f="${id}" class="${state.filter === id ? 'on' : ''}">${label}</button>`;
  return `<h1>Новости для бизнеса</h1>${forWho(c)}
    ${c.data_quality.length ? `<div class="dq"><b>Качество данных:</b><br>${c.data_quality.map(esc).join('<br>')}</div>` : ''}
    <div class="filters">${f('all', 'Все')}${f('risk', 'Риски')}${f('opportunity', 'Возможности')}${f('info', 'К сведению')}</div>
    ${items.length ? items.map(cardHtml).join('') : '<div class="card empty">В этой категории событий нет</div>'}
    ${API ? `<div class="sec"><h3>Отобрано для компании из свежих новостей</h3><div id="events-box">${eventsHtml()}</div></div>` : ''}
    <footer class="note">Главный вывод сформулирован для роли «${esc(role().name)}». Порядок: сила влияния × важность тем для роли.</footer>`;
}
/* События, прошедшие отбор правилами (без LLM): видно, на какие признаки компании они сработали */
function eventsHtml() {
  const ev = state.events[state.company];
  if (ev === undefined) return '<div class="muted">Подбираем события…</div>';
  if (!ev.length) return '<div class="card empty">Среди собранных новостей нет событий, значимых для этой компании</div>';
  return ev.map(e => `<div class="card" style="margin-bottom:8px">
    <div class="ic-meta"><span class="imp">${esc(e.source)}${e.also ? ` +${e.also}` : ''}</span><span class="imp">релевантность ${String(e.score).replace('.', ',')}</span><span class="ic-date">${fmtDate(e.published)}</span></div>
    <div class="ic-event">${srcLink(e, esc(e.title))}</div>
    <div style="margin-top:6px">${e.matched.map(m => `<span class="chip f">${esc(m)}</span>`).join('')}</div>
    <div class="actions-row">${e.analyzed ? '<span class="muted">Разобрано — карточка в ленте</span>' : `<button class="btn" data-ev="${e.id}" ${state.busy ? 'disabled' : ''}>Разобрать агентом</button>`}</div></div>`).join('');
}
async function loadEvents() {
  if (!API || state.events[state.company] !== undefined) return;
  const cid = state.company;
  try { state.events[cid] = await api(`/api/companies/${cid}/events`); } catch (e) { state.events[cid] = []; }
  const box = document.getElementById('events-box');
  if (box && cid === state.company) { box.innerHTML = eventsHtml(); bindEvents(); }
}
/* Запуск агента: шаги показываются в панели «Как ИИ пришёл к выводу», карточка добавляется в ленту */
async function runAgent(path, body) {
  state.busy = true;
  $('#drawer-body').innerHTML = '<div class="step shown k-plan"><span class="dot"></span><div class="st">Агент работает</div><div class="sd">План → инструменты → черновик → самопроверка. Обычно 20–60 секунд.</div></div>';
  $('#drawer-totals').textContent = ''; $('#drawer').classList.add('open'); $('#overlay').classList.add('on');
  try {
    const r = await api(path, body);
    if (!r.ok) { openTrace({trace: r.trace}); $('#drawer-totals').textContent = 'Карточка не прошла проверку: ' + r.errors.slice(0, 2).join('; '); return null; }
    const cid = state.company;
    DATA.insights[cid] = [r.card, ...(DATA.insights[cid] || []).filter(c => c.id !== r.card.id)];
    ((DATA.origins = DATA.origins || {})[cid] = DATA.origins[cid] || {})[r.card.id] = 'agent';
    delete state.events[cid];
    closeOverlays(); location.hash = '#feed/' + r.card.id;
    return r.card;
  } catch (e) { closeOverlays(); showModal('Агент не запустился', e.message); return null; }
  finally { state.busy = false; }
}
function bindEvents() {
  document.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => runAgent(`/api/companies/${state.company}/events/${b.dataset.ev}/analyze`, {}));
}
function viewAnalyze() {
  return `<h1>Разобрать новость</h1><div class="muted">Вставьте новость, которой нет в ленте, — агент разберёт её для компании «${esc(company().display)}» и роли «${esc(role().name)}».</div>
    <form class="card" id="an-form" style="margin-top:16px;display:grid;gap:10px">
      <input name="title" placeholder="Заголовок новости" required minlength="5" maxlength="300" style="font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px">
      <textarea name="text" placeholder="Текст новости" rows="8" maxlength="8000" style="font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px"></textarea>
      <input name="url" placeholder="Ссылка на первоисточник (необязательно)" maxlength="500" style="font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px">
      <div><button class="btn pri" ${state.busy ? 'disabled' : ''}>Разобрать</button></div>
    </form>`;
}
function viewQuality() {
  return `<h1>Качество сервиса</h1><div class="muted">Метрики для регулярного мониторинга: обратная связь, проверка карточек, расход модели.</div><div id="q-box" class="card" style="margin-top:16px">Загружаем…</div>`;
}
async function loadQuality() {
  try {
    const m = await api('/api/metrics'), f = m.feedback, r = m.agent_runs, pct = x => x === null ? '—' : Math.round(x * 100) + '%';
    $('#q-box').innerHTML = `<div class="grid3">
      <div><div class="muted">Полезно / не про нас</div><h2>${f.useful} / ${f.not_relevant}</h2><div class="muted">доля полезных ${pct(f.useful_share)}</div></div>
      <div><div class="muted">Запусков агента</div><h2>${r.total}</h2><div class="muted">прошли проверку ${pct(r.pass_rate)}</div></div>
      <div><div class="muted">Расход модели</div><h2>${r.cost_rub.toLocaleString('ru-RU')} ₽</h2><div class="muted">среднее время ${(r.avg_ms / 1000).toFixed(1).replace('.', ',')} с</div></div></div>
      <div class="src-line">Карточек: ${Object.entries(m.cards).map(([k, v]) => `${k === 'seed' ? 'примеры' : 'агент'} — ${v}`).join(', ')}</div>`;
  } catch (e) { $('#q-box').textContent = e.message; }
}

/* ---------- чат, график, трасса ---------- */
function chartSvg(ch) {
  const W = 420, H = 160, pad = 24, max = Math.max(...ch.points.map(p => p[1])) * 1.15, step = (W - pad * 2) / ch.points.length, bw = step * 0.55;
  const bars = ch.points.map((p, k) => { const h = p[1] / max * (H - 46), x = pad + k * step + (step - bw) / 2, y = H - 22 - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="var(--ai)" opacity="${.55 + .45 * (k + 1) / ch.points.length}"/>
    <text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="12" fill="var(--ink)">${String(p[1]).replace('.', ',')}</text>
    <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(p[0])}</text>`; }).join('');
  return `<div class="chart"><div class="cap">${esc(ch.title)}</div><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${bars}</svg>${ch.note ? `<div class="note">${esc(ch.note)}</div>` : ''}</div>`;
}
let traceTimers = [];
function openTrace(i) {
  traceTimers.forEach(clearTimeout); traceTimers = [];
  const body = $('#drawer-body');
  body.innerHTML = i.trace.map(s => `<div class="step k-${s.kind}"><span class="dot"></span><div class="st">${esc(s.title)}</div><div class="sd">${esc(s.detail)}</div>
    <div class="sm">${s.ms ? (s.ms / 1000).toFixed(1).replace('.', ',') + ' с' : ''}${s.cost ? ' · ' + s.cost.toFixed(2).replace('.', ',') + ' ₽' : ''}</div></div>`).join('');
  const total = i.trace.reduce((a, s) => a + s.cost, 0), time = i.trace.reduce((a, s) => a + s.ms, 0);
  $('#drawer-totals').textContent = `Шагов: ${i.trace.length} · время: ${(time / 1000).toFixed(1).replace('.', ',')} с · стоимость: ${total.toFixed(2).replace('.', ',')} ₽`;
  $('#drawer').classList.add('open'); $('#overlay').classList.add('on');
  let t = 150;
  [...body.querySelectorAll('.step')].forEach((el, k) => { traceTimers.push(setTimeout(() => el.classList.add('shown'), t)); t += Math.min(900, 250 + i.trace[k].ms / 6); });
}
function closeOverlays() { $('#drawer').classList.remove('open'); $('#overlay').classList.remove('on'); $('#modal').classList.remove('on'); }

/* ---------- роутинг и события ---------- */
function render(scrollToOpen = false) {
  const [route, arg] = (location.hash || '#home').slice(1).split('/');
  const r = route === 'insight' ? 'feed' : route;   // старые ссылки #insight/id
  if (r === 'feed' && arg && state.open !== arg) { state.open = arg; markRead(arg); scrollToOpen = true; }
  if (!state.busy) closeOverlays();
  renderNav(r); renderStatus();
  const views = {feed: viewFeed, analyze: viewAnalyze, quality: viewQuality};
  $('#app').innerHTML = (API && views[r] || (r === 'feed' ? viewFeed : viewHome))();
  state.firstPaint = false;
  bind();
  if (r === 'feed') { loadEvents(); bindEvents(); }
  if (r === 'quality' && API) loadQuality();
  if (r === 'analyze' && API) $('#an-form').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target);
    runAgent('/api/analyze', {company_id: state.company, title: f.get('title'), text: f.get('text'), url: f.get('url')}); };
  if (scrollToOpen && state.open) { const el = document.getElementById('card-' + state.open); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  else if (!arg) window.scrollTo(0, 0);
}
function markRead(id) { state.read.add(state.company + ':' + id); }
function toggle(id) {
  if (state.open === id) { state.open = null; history.replaceState(null, '', '#feed'); render(); return; }
  state.open = id; markRead(id);
  history.replaceState(null, '', '#feed/' + id);
  render(true);
}
function bind() {
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { state.filter = b.dataset.f; render(); });
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggle(b.dataset.toggle));
  if (!state.open) return;
  const i = ranked().find(x => x.id === state.open); if (!i) return;
  const card = document.getElementById('card-' + i.id); if (!card) return;
  card.querySelector('[data-trace]').onclick = () => openTrace(i);
  card.querySelector('[data-chat]').onclick = () => { state.chatOpen[i.id] = !state.chatOpen[i.id]; render(); };
  card.querySelectorAll('[data-fb]').forEach(b => b.onclick = () => { state.feedback[i.id] = b.dataset.fb; render();
    if (API) api(`/api/cards/${i.id}/feedback`, {company_id: state.company, role: state.role, vote: b.dataset.fb}).catch(() => {}); });
  card.querySelectorAll('[data-cta]').forEach(b => b.onclick = () => {
    const mgr = b.dataset.cta === 'manager';
    $('#modal-title').textContent = mgr ? 'Заявка отправлена' : b.dataset.label;
    $('#modal-text').textContent = mgr ? 'Персональный менеджер свяжется с вами в течение рабочего дня. К заявке приложена эта карточка.'
      : 'В рабочей версии здесь откроются условия продукта, подобранные под профиль компании.';
    $('#modal').classList.add('on'); $('#overlay').classList.add('on');
  });
  const log = card.querySelector('.chat-log');
  const push = (q, html) => { (state.chats[i.id] = state.chats[i.id] || []).push(`<div class="msg u">${esc(q)}</div>`, `<div class="msg a">${html}</div>`); log.innerHTML = state.chats[i.id].join(''); };
  card.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const c = i.chat[+b.dataset.q]; push(c.q, c.a.map(s => stmtHtml(s)).join('') + (c.chart ? chartSvg(c.chart) : '')); });
  card.querySelector('.chat-in').onsubmit = async e => { e.preventDefault(); const inp = e.target.querySelector('input'), q = inp.value.trim(); if (!q) return;
    inp.value = '';
    if (!API) { push(q, '<div class="muted">В прототипе работают подсказанные вопросы. В рабочей версии ответ соберёт агент — с той же разметкой «факт / банк / ИИ».</div>'); return; }
    log.insertAdjacentHTML('beforeend', `<div class="msg u">${esc(q)}</div><div class="msg a muted" id="chat-wait">Ищем ответ в аналитике банка…</div>`);
    try { const r = await api(`/api/cards/${i.id}/chat`, {company_id: state.company, q});
      (state.chats[i.id] = state.chats[i.id] || []).push(`<div class="msg u">${esc(q)}</div>`, `<div class="msg a">${r.a.map(s => stmtHtml(s, i)).join('')}${r.chart ? chartSvg(r.chart) : ''}</div>`);
    } catch (err) { (state.chats[i.id] = state.chats[i.id] || []).push(`<div class="msg u">${esc(q)}</div>`, `<div class="msg a muted">${esc(err.message)}</div>`); }
    log.innerHTML = state.chats[i.id].join(''); };
}
$('#overlay').onclick = closeOverlays; $('#drawer-close').onclick = closeOverlays; $('#modal-ok').onclick = closeOverlays;
window.addEventListener('hashchange', () => render());
(async function boot() {
  if (API) {
    try { DATA = await api('/api/bootstrap'); }
    catch (e) { $('#app').innerHTML = `<div class="card empty">Сервис недоступен: ${esc(e.message)}</div>`; return; }
  }
  state.company = DATA.companies[0].id; state.role = DATA.roles[0].id;
  initSwitchers();
  render();
})();
</script>
</body>
</html>

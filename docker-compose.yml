services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # без .env сервис стартует: отбор и готовые карточки работают, разбор новых новостей — нет
    volumes:
      - cache:/app/data/cache   # карточки, обратная связь, кеш ответов модели переживают перезапуск
    restart: unless-stopped

volumes:
  cache:
